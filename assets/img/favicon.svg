<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Andrew Salisbury">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a78d6"/>
      <stop offset="1" stop-color="#1baf7a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <!-- A -->
  <text x="25.6" y="34" font-family="Arial, Helvetica, sans-serif" font-weight="800"
